# The production demo image (nginx + built app) in front of the e2e test server
# (the real backend with phone.email stubbed). Used by `npm run test:docker`.
services:
  api:
    image: node:22-bookworm-slim
    working_dir: /repo/e2e
    command: ../server/node_modules/.bin/tsx test-server.ts
    environment:
      PORT: "4000"
      CORS_ORIGIN: http://localhost:${E2E_DOCKER_PORT:-5181}
      COOKIE_SECURE: "false"
      RATE_LIMIT_PER_MINUTE: "1000"
    volumes:
      - ../server:/repo/server:ro
      - .:/repo/e2e:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      retries: 30

  demo:
    build:
      context: ..
      dockerfile: demo/Dockerfile
      args:
        VITE_PHONE_EMAIL_CLIENT_ID: e2e-client
    environment:
      API_UPSTREAM: http://api:4000
    ports:
      - "${E2E_DOCKER_PORT:-5181}:8080"
    depends_on:
      api:
        condition: service_healthy
