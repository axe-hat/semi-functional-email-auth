version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/server", "/demo", "/e2e", "/e2e/consumer"]
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/server", "/demo"]
    schedule:
      interval: weekly
