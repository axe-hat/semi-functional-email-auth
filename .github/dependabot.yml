version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/server", "/demo", "/e2e", "/e2e/consumer"]
    schedule:
      interval: weekly
    # The library is developed against the oldest React it supports (18); React 19 has its own CI
    # job. Moving the dev copy to a new major would silently drop the React 18 coverage.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react*"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/server", "/demo"]
    schedule:
      interval: weekly
