name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Package version, React version, Node.js version, browser
      placeholder: semi-functional-email-auth 1.1.0, React 19.3, Node 24, Chrome 141
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      render: text
  - type: markdown
    attributes:
      value: "**Security issue?** Please don't open an issue. See [SECURITY.md](../blob/main/SECURITY.md)."
